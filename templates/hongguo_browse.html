<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>红果短剧 - 视频号短剧管理系统</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    .hg-tabs{display:flex;gap:8px;margin-bottom:12px}
    .hg-tab{padding:6px 14px;background:#eee;border-radius:16px;cursor:pointer;font-size:14px}
    .hg-tab.on{background:#ff6b35;color:#fff}
    .hg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
    .hg-card{background:#fff;border:1px solid #eee;border-radius:8px;overflow:hidden;cursor:pointer;transition:.15s}
    .hg-card:hover{transform:translateY(-3px);box-shadow:0 4px 14px rgba(0,0,0,.12)}
    .hg-card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#ddd}
    .hg-card .b{padding:8px}
    .hg-card .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hg-card .m{font-size:12px;color:#888;margin-top:3px}
    .hg-badge{background:#ff6b35;color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px}
    #hgModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1050}
    #hgModal .box{background:#fff;border-radius:10px;width:min(720px,92vw);max-height:88vh;overflow:auto;padding:20px}
    .hg-eps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
    .hg-ep{width:42px;height:34px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;border-radius:5px;cursor:pointer;font-size:13px}
    .hg-ep:hover{background:#ff6b35;color:#fff}
  </style>
</head>
<body class="app-body">
  {% set active_page = 'hongguo' %}
  <div class="app-shell">
    {% include "partials/sidebar.html" %}
    <div class="app-main">
      <header class="app-topbar">
        <div>
          <h1 class="app-page-title">红果短剧</h1>
          <p class="app-page-subtitle">搜索 / 榜单 / 今日上新 / 下载（自建红果链路）</p>
        </div>
        <div class="app-userbar">
          <span class="app-user-chip">{{ session.username }} · {{ session.role }}</span>
          <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('logout') }}">退出</a>
        </div>
      </header>
      <main class="app-content app-content-fluid">
        <div class="card"><div class="card-body">
          <div class="hg-tabs">
            <div class="hg-tab on" data-v="search">搜索</div>
            <div class="hg-tab" data-v="rank">榜单</div>
            <div class="hg-tab" data-v="latest">今日上新</div>
          </div>
          <div id="hgSub" class="mb-3"></div>
          <div id="hgGrid" class="hg-grid"></div>
        </div></div>
      </main>
    </div>
  </div>
  <div id="hgModal"><div class="box" id="hgBox"></div></div>

<script>
const A=location.origin; let view='search', curId=null, curEps=[], lastUrl='';
const sub=document.getElementById('hgSub'), grid=document.getElementById('hgGrid');
const modal=document.getElementById('hgModal'), box=document.getElementById('hgBox');
modal.onclick=e=>{if(e.target===modal)modal.style.display='none'};
async function get(p,q){const u=new URL(A+p);Object.entries(q||{}).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{credentials:'same-origin'});if(!r.ok)throw new Error((await r.json()).detail||r.status);return r.json()}
document.querySelectorAll('.hg-tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.hg-tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');view=t.dataset.v;renderSub()});
function renderSub(){
  grid.innerHTML='';
  if(view==='search'){sub.innerHTML=`<div class="input-group" style="max-width:420px"><input id="hgq" class="form-control" placeholder="输入剧名"><button class="btn btn-primary" onclick="doSearch()">搜索</button></div>`;document.getElementById('hgq').onkeydown=e=>e.key==='Enter'&&doSearch();}
  else if(view==='rank'){sub.innerHTML=`<select id="hgb" class="form-select" style="max-width:200px;display:inline-block"><option value="recommend">推荐榜</option><option value="hot">热播榜</option><option value="new">新剧榜</option></select> <button class="btn btn-primary" onclick="doRank()">刷新</button>`;doRank();}
  else{sub.innerHTML=`<select id="hgg" class="form-select" style="max-width:160px;display:inline-block"><option value="short_play">短剧</option><option value="comic_series">漫剧</option><option value="ai_series">AI短剧</option></select> <button class="btn btn-primary" onclick="doLatest()">刷新</button>`;doLatest();}
}
async function doSearch(){const v=document.getElementById('hgq').value.trim();if(!v)return;grid.innerHTML='搜索中...';try{cards((await get('/search',{q:v})).results)}catch(e){grid.innerHTML='错误: '+e.message}}
async function doRank(){grid.innerHTML='加载中...';try{cards((await get('/rank',{board:document.getElementById('hgb').value,limit:30})).items)}catch(e){grid.innerHTML='错误: '+e.message}}
async function doLatest(){grid.innerHTML='加载中...';try{cards((await get('/latest',{genre:document.getElementById('hgg').value,limit:120})).items)}catch(e){grid.innerHTML='错误: '+e.message}}
function cards(list){grid.innerHTML='';if(!list||!list.length){grid.innerHTML='无结果';return}list.forEach(it=>{const d=document.createElement('div');d.className='hg-card';const cv=it.cover?'/img?url='+encodeURIComponent(it.cover):'';const hot=it.hot||(it.play_cnt?(it.play_cnt/10000|0)+'万播放':'');d.innerHTML=`<img loading="lazy" src="${cv}" onerror="this.style.opacity=.2"><div class="b"><div class="t">${it.title||''}${it.today?'<span class="hg-badge">今日</span>':''}</div><div class="m">${it.episode_cnt||0}集 ${it.score?'★'+it.score:''} ${hot}</div></div>`;d.onclick=()=>openSeries(it.series_id);grid.appendChild(d)})}
async function openSeries(sid){curId=sid;modal.style.display='flex';box.innerHTML='加载中...';try{const r=await get('/episodes',{series_id:sid});curEps=r.episodes;const m=r.meta;box.innerHTML=`<div style="float:right;cursor:pointer;font-size:22px;color:#999" onclick="hgModal.style.display='none'">×</div><h4>${m.title}</h4><div class="text-muted small">${m.status} · ${m.episode_cnt}集 · ${(m.play_cnt/10000|0)}万播放 · ${(m.category||[]).join('/')}</div><p class="small text-muted">${(m.intro||'').slice(0,120)}</p><div class="mb-2">范围 <input id="hgr" value="all" style="width:90px"> <button class="btn btn-sm btn-primary" onclick="copyLinks()">📋复制直链(批量)</button> <button class="btn btn-sm btn-outline-secondary" onclick="doDownload()">下载到服务器</button></div><div id="hgp" class="small text-success"></div><div class="hg-eps">${curEps.map(e=>`<div class="hg-ep" onclick="playEp(${e.index})">${e.index}</div>`).join('')}</div>`}catch(e){box.innerHTML='错误: '+e.message}}
async function playEp(i){const p=document.getElementById('hgp');p.textContent='获取第'+i+'集...';try{const r=await get('/play',{series_id:curId,ep:String(i)});const u=r.episodes[0]?.url;lastUrl=u||'';const dl=A+'/stream?series_id='+curId+'&ep='+i;p.innerHTML=`第${i}集: `+(u?`<a href="${u}" target="_blank">▶️播放</a> <a href="#" onclick="cp(lastUrl);return false">📋复制直链</a> `:'(无直链) ')+`<a href="${dl}">⬇️经服务器下载</a>`}catch(e){p.textContent='错误: '+e.message}}
async function copyLinks(){const rng=document.getElementById('hgr').value.trim()||'all';const p=document.getElementById('hgp');p.textContent='获取直链...';try{const r=await get('/play',{series_id:curId,ep:rng});const ls=r.episodes.filter(e=>e.url).map(e=>e.url);await cp(ls.join('\n'));p.innerHTML=`<span class="text-success">已复制 ${ls.length} 条直链</span>,粘到IDM/迅雷批量下载`}catch(e){p.textContent='错误: '+e.message}}
async function doDownload(){const rng=document.getElementById('hgr').value.trim()||'all';const p=document.getElementById('hgp');p.textContent='提交...';try{const r=await get('/download',{series_id:curId,ep:rng});const t=r.task_id;const poll=setInterval(async()=>{const s=await get('/download/status',{task_id:t});p.textContent=`[${s.state}] ${s.done}/${s.total} 失败${s.failed}`;if((s.state||'').match(/完成|错误/)){clearInterval(poll)}},1500)}catch(e){p.textContent='错误: '+e.message}}
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){}}
renderSub();
</script>
</body>
</html>

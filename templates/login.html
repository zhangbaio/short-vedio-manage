<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - 视频号短剧管理系统</title>
  <link rel="icon" href="{{ url_for('static', filename='icons/app-icon.ico') }}?v=20260531" sizes="any" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/app-icon.png') }}?v=20260531" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/app-icon.png') }}?v=20260531" />
  <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 18%, color-mix(in srgb, var(--app-primary) 9%, transparent), transparent 32%),
        linear-gradient(180deg, color-mix(in srgb, var(--app-bg-top) 82%, #fff), var(--app-bg)),
        var(--app-bg);
      color: var(--app-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", sans-serif;
    }

    .login-shell {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      padding: 40px;
      border: 1px solid var(--app-border);
      border-radius: 12px;
      background: var(--app-surface);
      box-shadow: var(--app-shadow-lg);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand-main {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--app-brand-bg);
      box-shadow: var(--app-brand-shadow);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
    }

    .brand-title {
      margin: 0;
      color: var(--app-page-title);
      font-size: 20px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .brand-subtitle {
      margin: 4px 0 0;
      color: var(--app-muted);
      font-size: 13px;
    }

    .form-label {
      margin-bottom: 8px;
      color: var(--app-page-title);
      font-size: 14px;
      font-weight: 650;
    }

    .field {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--app-subtle);
      pointer-events: none;
    }

    .form-control {
      min-height: 46px;
      padding: 11px 14px 11px 44px;
      border: 1px solid var(--app-border-strong);
      border-radius: 8px;
      background: var(--app-surface);
      color: var(--app-text);
      font-size: 14px;
      box-shadow: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .form-control::placeholder {
      color: var(--app-subtle);
    }

    .form-control:focus {
      border-color: var(--app-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--app-primary) 18%, transparent);
    }

    .btn-login {
      width: 100%;
      min-height: 46px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: var(--app-primary);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      transition: background-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
    }

    .btn-login:hover,
    .btn-login:focus {
      background: var(--app-primary-strong);
      box-shadow: 0 10px 24px color-mix(in srgb, var(--app-primary) 24%, transparent);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-alert {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 22px;
      padding: 12px 14px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fff1f2;
      color: #b91c1c;
      font-size: 14px;
      line-height: 1.45;
    }

    .error-alert svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin-top: 1px;
      fill: currentColor;
    }

    .login-footer {
      margin: 18px 0 0;
      color: var(--app-subtle);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .login-shell {
        padding: 18px;
      }

      .login-card {
        padding: 28px 22px;
      }

      .brand {
        align-items: flex-start;
        margin-bottom: 26px;
      }

      .brand-main {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-label="登录">
      <div class="brand">
        <div class="brand-main">
          <div class="brand-mark">短</div>
          <div>
            <h1 class="brand-title">视频号短剧管理系统</h1>
            <p class="brand-subtitle">请输入账号信息登录工作台</p>
          </div>
        </div>
      </div>

      {% if error %}
      <div class="error-alert">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a10 10 0 1 0 .01 0H12Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label for="username" class="form-label">用户名</label>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.4 0-8 2.1-8 4.7V20h16v-1.3c0-2.6-3.6-4.7-8-4.7Z"/>
            </svg>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="请输入用户名"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">密码</label>
          <div class="field">
            <svg class="field-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V7Zm3 10.7V19h-2v-1.3a2 2 0 1 1 2 0Z"/>
            </svg>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="请输入密码"
              autocomplete="current-password"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-login">登录</button>
      </form>
    </section>

    <p class="login-footer">© 2026 视频号短剧管理系统</p>
  </main>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>

<div class="app-theme-switch" aria-label="主题切换">
  <button
    type="button"
    class="app-theme-option app-theme-option-default"
    data-theme-choice="default"
    aria-label="切换为蓝色主题"
    title="蓝色主题"
  ></button>
  <button
    type="button"
    class="app-theme-option app-theme-option-sunset"
    data-theme-choice="sunset"
    aria-label="切换为暖色视频主题"
    title="暖色视频主题"
  ></button>
</div>
